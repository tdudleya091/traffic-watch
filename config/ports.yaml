# Each port gets a 200 x 200 mile view centred on (lat, lon).
#
# `group` = which OpenSky query box the port shares. Ports in one group are
# fetched with a single bounding-box call, so keep the union of each group's
# boxes under 25 sq deg (1 credit per call). The app prints a warning at
# startup if a group costs more than that.
#
# `station` = ICAO airport used for the current-conditions / TAF panel
#             (`taf_station` overrides the TAF source when `station` has none).
# `harbors` = extra port labels drawn on the map, beyond Natural Earth's list.
#
# To add a port later: append an entry, pick or create a group, restart.

defaults:
  half_side_miles: 100

# Dropdown sections, in display order: region -> OpenSky groups.
regions:
  West Coast: [SoCal, Bay Area, Pacific Northwest]
  Alaska and Hawaii: [Alaska, Hawaii]
  Gulf Coast: [Central Gulf, Houston, Corpus Christi, Tampa Bay]
  Southeast Atlantic: [Florida Atlantic, Jacksonville-Savannah, Carolinas]
  Northeast and Mid-Atlantic: [Hampton Roads, Chesapeake, New York, New England]
  Great Lakes: [Lake Michigan, Detroit]
  Japan: [Kanto, Setouchi, Kyushu, Tohoku-Hokkaido, Wakkanai, Okinawa]

